name: vidcraft_ai
description: "VidCraft AI - turn an idea into a ready-to-publish short video."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.5.0
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  intl: any
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
