name: vidcraft_ai
description: "VidCraft AI - turn an idea into a ready-to-publish short video."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: 1.5.0
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  video_player: ^2.9.2
  url_launcher: ^6.3.1
  intl: any
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  gal: ^2.3.3
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
